<script>
"use strict";

const SEED={"articles":[{"id":"seed-1","title":"天之縫：世界的接合線","category":"世界觀","summary":"天之縫不是普通裂紋。\n它是一道幾乎沒有寬度的直線，沿著圓柱世界的軸線伸展。\n無論岩石、道路、建築、水流或其他地形如何變化，它都保持著異常筆直的方向。\n在天氣清晰的時候，站在都市最高處，可以看見那道線從高空延伸到深淵深處。\n\n天之縫","body":"天之縫不是普通裂紋。\n它是一道幾乎沒有寬度的直線，沿著圓柱世界的軸線伸展。\n無論岩石、道路、建築、水流或其他地形如何變化，它都保持著異常筆直的方向。\n在天氣清晰的時候，站在都市最高處，可以看見那道線從高空延伸到深淵深處。\n\n天之縫的五條法則\n\n**第一，幾何上的絕對連續。 世界兩側並不是以普通岩石黏合，而是空間本身被接合。因此，天之縫的兩側可以是同一條正常道路。居民能夠直接走過它，卻仍可觀察到地面材質與紋理在接合位置發生突變。**\n\n**第二，物質並不必然一致。 有時一側是花崗岩，另一側卻是完全不同年代的沉積岩，彷彿兩個原本相隔極遠的地方被迫成為鄰居。**\n\n**第三，會產生微弱能量擾動。 接合處存在可量度的熱、電磁及魔力波動。科技學者稱它為「縫合殘差」，魔法師則稱它為「神的餘音」。**\n\n**第四，不能被普通手段永久消除。 即使將縫線周圍的石塊挖走、以金屬遮蓋或修建建築，新的暴露表面仍然會留下接合痕跡。這是空間界面，而不是一條可以剷走的油漆線。**\n\n**第五，越接近深層，擾動越強。 在城市的正常居住區，天之縫相當穩定。但在更深的地方，它可能產生足以扭曲聲音、重力與生物感知的現象。**\n\n這條線在都市具有極大的象徵性。甚至可以說，五萬名市民雖然共同生活，卻對這條線的真正意義持有截然不同的看法。\n\n\n### 《合縫廣場》（The Joining Plaza）\n\n位於環淵中環與城市外側岩壁相接的位置。\n這裡是兩派共同使用的宗教廣場，中央保留一段未被建築遮蓋的天之縫。\n\n《縫線中立約章》（The Seam Neutrality Charter）\n根據約章，任何教團都不得獨占天之縫、永久封閉公共觀測區，或單方面進行可能改變接合結構的實驗。\n因此，聖痕派與縫禮派必須合作管理這個地方。\n\n### 共同宗教儀式：《合縫禮》\n\n每年界外第三日，兩派會共同舉行合縫大典。\n\n儀式具有三個階段。\n\n第一階段：測量。 聖痕派神職人員向全城公布天之縫的年度觀測結果，象徵人類沒有停止理解世界。\n第二階段：聆聽。 縫禮派神職人員宣讀過去一年居民留下的故事、願望及紀念，象徵世界不只由數字構成。\n第三階段：交縫。 兩派共同在廣場中央點亮一道象徵性光線，讓機械光源與魔法光源在天之縫前重合。\n\n最後由雙方代表共同宣讀：\n\n> 「以知識理解世界。」\n> 「以幻想延續世界。」\n> 「願我們永遠不忘，兩端曾經分離。」\n\n","visibility":"published","updated_at":"2026-10-24","order_index":0},{"id":"seed-2","title":"環淵：沿深淵而建的城市","category":"城市生活","summary":"> 「向上，是人類遺忘的天空。向下，是世界尚未說完的故事。而我們，生活在兩者之間。」\n> \n> ——《環淵建城史》序言\n\n環淵並不只是蒸汽朋克與魔法建築混合的城市，而是一個經過約1900年發展，已經擁有自己的政治制度、宗教、時間觀","body":"\n> 「向上，是人類遺忘的天空。向下，是世界尚未說完的故事。而我們，生活在兩者之間。」\n> \n> ——《環淵建城史》序言\n\n環淵並不只是蒸汽朋克與魔法建築混合的城市，而是一個經過約1900年發展，已經擁有自己的政治制度、宗教、時間觀念、經濟體系與獨特日常文化的地方。\n\n其中最重要的三個象徵是：\n天之縫象徵世界的起源；中央深淵象徵人類尚未理解的未知；環淵大鐘則象徵人類親手建立的秩序。\n\n### 1. 都市的地理形態\n\n環淵沿著圓柱形岩壁建造，擁有多條環形街道、懸空平台、垂直運輸軌道與穿入岩層的住宅。\n城市大致分成三個主要區域：\n- 上環（Upper Meridian）：蒸汽科技、機械工業、行政機構和高空探索設施。\n- 中環（Central Meridian）：公共市場、交通樞紐、城市政府、遺物交易與共同生活區。\n- 下環（Lower Meridian）：魔法學院、符文工業、魔力研究、醫療設施及深淵探索基地。\n\n## 第二章｜環淵的六大重要區域\n\n我建議讓每個區域都有一個獨特地標，令玩家一聽到地名，就知道它位於甚麼地方。\n\n\n\nA1｜鐘械上城（Clockwork Crown）\n環淵最高的主要居住區，佈滿煙囪、蒸汽管、巨型齒輪、升降塔及機械工坊。\n這裡設有環淵工學院、機械議會和登穹者的總部。\n城市最大的機械鐘亦設於此。\n\n\n\nA2｜天軌港（Skyrail Port）\n城市上方探索的出入口，負責接收來自高層遺跡的機械遺物及礦物。\n大型升降車、懸吊貨櫃與登穹者整備室集中於此。\n登穹者遠征歸來後，必須先經過負荷觀察。\n\n\n\nB1｜交界大市（Confluence Market）\n全城最大的商業中心。機械零件、魔法材料、日常食品、冒險裝備及合法遺物均在這裡交易。\n上環居民與下環居民在此交流，亦是城中最容易聽到各種探險傳聞的地方。\n黑市則隱藏在舊運輸隧道之中。\n\n\n\nB2｜縫聖廣場（Seam Sanctum）\n\n建於都市外側岩壁的天之縫前方。\n一道由高空垂直延伸至深淵的筆直縫線，穿過廣場後方的巨大岩面。\n這裡是全城最重要的宗教與觀測地標。科技學者與魔法祭司可以共同使用廣場，但各有獨立的觀測設施及祭壇。\n\n\n\nC1｜靈紋下城（Runewoven Quarter）\n\n下環最大的居住和研究區域。\n建築以石材、晶體、符文與懸浮照明為主。街道兩旁設有符文工坊、魔法學院、秘術醫院及遺物修復所。\n這裡的居民相信，城市的魔力來自世界創造時留下的殘響。\n\n\n\nC2｜深淵門（Abyss Gate）\n\n環淵最低的官方探索港。\n這裡設有潛淵者公會、探險物資倉庫、負荷醫院、深度測量站及大型下降平台。\n通過最後一座防護門後，便進入政府無法完全保證安全的探索區域。\n\n### 中央透明城牆\n\n環淵內側設有一圈高6米的透明防護牆。\n我建議城牆使用透明強化層壓材料配合機械骨架及魔法穩定裝置，令它同時具有蒸汽科技與魔法文明的特色。\n牆上設有交錯守衛的巡邏平台，分成兩種主要職責：\n\n**內向衛兵（Inward Watch）**\n負責阻止居民意外墜落、非法翻牆及城內事故。\n**外向衛兵（Outward Watch）**\n負責監察深淵方向的生物活動、攀附岩壁的異常物體，以及未經登記的探索者。\n\n由於城市垂直延伸，城牆並不是只有一個平面的單一護欄，而是在各個主要居住平台的中央開口邊緣設有相連的防護系統。","visibility":"published","updated_at":"2026-10-24","order_index":1},{"id":"seed-3","title":"環淵的縫合曆","category":"曆法與歷史","summary":"「齒輪使我們前進，符紋使我們存續，而天之縫提醒我們，這世界曾經不是這個模樣。」\n“Gears carry us forward, runes keep us alive, and the Seam reminds us that ","body":"\n「齒輪使我們前進，符紋使我們存續，而天之縫提醒我們，這世界曾經不是這個模樣。」\n“Gears carry us forward, runes keep us alive, and the Seam reminds us that the world was not always thus.”\n\n原因是這個世界在1900年前已被改造成圓柱形，而居民長期依賴人工光源、機械鐘及魔法觀測生活。\n所以他們的曆法應該是一套由人類主動建立的制度。\n\n# 年曆（Seam Calendar）\n\n紀年簡稱：SE — Seam Era\n世界被捲合的年份，定為縫合曆元年。\n但要注意，天神改造世界的瞬間並不一定是元年的第一天。後世學者可能在很久之後，才根據歷史文獻決定元年。\n\n我建議這不是因為天體運動，而是源自城市早期的維修輪班制度。\n在環淵成立初期，居民需要輪流保養供水、照明、空氣和食物設施，於是建立六日工作循環。\n後來這套制度逐漸演變成全城通行的星期。\n\n環淵六日週（The Sixfold Week）\n\n齒日 Cogday\n工程與生產\n泉日 Flowday\n供水與農務\n商日 Tradeday\n市場與交易\n紋日 Runeday\n學術與魔法\n衛日 Guardday\n城防與檢修\n息日 Restday\n家庭與休息\n\n星期名稱反映歷史起源，不代表所有居民都在同一天從事同一工作。醫院、城防與能源設施仍需全天候運作。\n\n## 十二環月\n\n我建議一年分成12個月，每月30天，共360日。\n另外設立5個不屬於任何月份的「界外日」，組成365日的一年。\n這樣能建立整齊的行政制度，同時讓年末的五天具有特殊宗教和文化意義。\n\n|月份|中文名稱|英文名稱|文化意義|\n|---|---|---|---|\n|一月|初輪月|Firstwheel|新年、機械重新校準|\n|二月|銅鳴月|Brasssong|工匠、發明、工學慶典|\n|三月|泉湧月|Wellspring|水源、農耕與生命|\n|四月|燈芽月|Lamploom|幼苗、人工光照、教育|\n|五月|高軌月|Highrail|登穹者遠征、交通|\n|六月|天望月|Skywatch|上方探索與觀星|\n|七月|交衡月|Equibalance|上下城交流與議政|\n|八月|紋輝月|Runeglow|魔法研究、符文工藝|\n|九月|晶生月|Crystalgrowth|深淵礦物、遺物鑑定|\n|十月|淵潮月|Abyssflow|潛淵者、深度觀測|\n|十一月|迴聲月|Echofall|亡者紀念、遠征歸還|\n|十二月|終輪月|Lastwheel|年度結算、機械保養|\n五個界外日（The Five Unbound Days）\n每年12月30日之後，居民會迎來五個不隸屬於任何月份的特殊日子。\n它們同時紀念世界曾經是平面，以及人類經歷的創世災難。\n\n界外日\t英文名稱\t主要活動\n第一日｜舊土日\tDay of Old Earth\t紀念縫合前的人類文明\n第二日｜黑翼日\tDay of Black Wings\t追悼黑龍襲擊的死者\n第三日｜合縫日\tDay of Joining\t舉行天之縫祈禱與科學觀測\n第四日｜無燈日\tDay Without Light\t全城進入短暫紀念性熄燈\n第五日｜新輪夜\tNight of the New Wheel\t年末慶典、迎接新年\n\n**環淵的一日：沒有太陽的晝夜**\n\n由於環淵居民未必能直接觀測天空，整座都市的生活節律由人工光照控制。\n上環採用大型電力燈陣與反射塔，下環則使用晶體照明和符文調光裝置。\n城市政府每年公布統一的「鐘日表」。\n\n\n\n每天05:00，環淵大鐘會敲響六下，象徵人類重新點亮城市。\n到了20:00，上下城的公共照明逐漸轉暗。\n\n居民將這個過程稱為「落日」，儘管並沒有真正的太陽落下。\n雙鐘制度\n由於這個世界存在天穹負荷、深淵負荷，以及極端地區的時間異常，我建議環淵採用兩種時間記錄：\n\n**城鐘時（City Standard Time）** 是所有法律、交通、學校和民生活動使用的統一時間。\n**遠征時（Expedition Elapsed Time）** 則由探險者攜帶獨立計時器記錄，用來量度隊伍自身經歷的時間。\n\n例如一支探險隊在深層經歷了40小時，返回後發現城市已經過去61小時，官方紀錄便會保留兩個數字。\n這也意味著探險者的死亡日期、失蹤日期及返回日期，可能具有特殊的法律爭議。\n\n# 環淵年度節慶與都市文化\n\n我建議城市不只有宗教節日，也有大量來自工業、魔法與探索文化的節慶。\n\n初輪月 1日｜啟輪祭（First Turning Festival）\n城市新年。環淵大鐘會在凌晨重新啟動象徵性主齒輪，蒸汽管道奏響鳴笛。\n居民彼此贈送小型齒輪掛飾或符文護符，寓意新一年的生命仍能順利運轉。\n\n紋輝月 18日｜千紋燈會（Festival of a Thousand Runes）\n下環最大的魔法節日，魔法學徒會製作漂浮符文燈，讓它們環繞中央深淵緩緩移動。\n傳說燈火會將祝福帶往世界最深處。\n\n高軌月 6日｜登穹紀念日（Ascension Day）\n紀念首支成功進入上方異常領域並返回的正式探險隊。\n登穹者會展示機械遺物與探索裝備，上城亦會舉行飛行器及攀登裝置競賽。\n\n迴聲月 30日｜歸響夜（Night of Returning Echoes）\n紀念所有未能從天穹與深淵返回的探險者。\n家屬會在中央城牆旁點亮紀念燈，而公會會宣讀過去一年失蹤者的名字。\n這一天，無論上環或下環都不會舉辦大型遠征出發儀式。\n\n界外第三日｜合縫大典（The Joining Rite）\n城中最重要的宗教與歷史紀念活動。\n上城科學家會公布天之縫的年度觀測報告，下城祭司則會舉行祈禱儀式。\n每年也可能因此出現教義爭論、學術爭議或政治集會。\n\n界外第四日｜無燈日（Day Without Light）\n這一天晚上，所有非必要的公共照明會在指定時間短暫熄滅。\n城市保留醫院、城防、交通及維生設施的必要供電。\n居民在黑暗中望向天之縫，紀念當年文明被黑龍摧毀的黑暗時刻。\n傳說在這一天，某些人會聽見天之縫發出聲音。\n\n\n## 環淵人的生活與社會\n\n### 上下城的文化差異\n\n|生活面向|上環|下環|\n|---|---|---|\n|主要照明|電燈、蒸汽燈|符文燈、光晶|\n|建築風格|鋼鐵、磚石、銅管|石雕、晶體、魔紋|\n|教育重點|數學、工程、物理|符文、響場、生物學|\n|主要職業|工程師、機械師、登穹者|魔導師、煉金師、潛淵者|\n|醫療方法|外科、機械輔具、藥劑|魔法治療、精神穩定術|\n|社會觀念|相信可測量與可複製|重視感知、共鳴與傳承|\n\n\n### 遺物交易與貨幣\n\n由於環淵是科技與魔法遺物的主要交易中心，我建議採用統一貨幣：\n\n環幣（Ringmark，RM）\n貨幣由環淵共同政府發行，實體貨幣可使用金屬幣、紙券或經認證的電子帳戶。\n遺物不能直接在普通市場自由買賣，必須由官方遺物鑑定所進行登記。\n登記時會記錄來源、管理等級、已知功能、使用代價，以及是否會造成天穹或深淵負荷。\n沒有鑑定證書的高危遺物若被帶入居住區，會由環淵守衛隊介入處理。\n\n### 探險者對城市的意義\n\n探險者不只是冒險故事中的主角，而是維持整個城市技術發展的重要職業。\n他們從上方帶回機構遺物、未知金屬與古文明記錄；從下方帶回秘術遺物、特殊生物與稀有魔法材料。\n但在每次遠征之後，他們亦有可能需要支付高昂的醫療費、接受長期負荷治療，甚至無法重新投入工作。\n因此，城市設有公共遠征保險基金及失蹤者家屬撫恤制度，令這份職業既有榮耀，也有沉重的現實代價。\n\n\n\n","visibility":"published","updated_at":"2026-10-24","order_index":2},{"id":"seed-4","title":"序場與天穹負荷","category":"探索指南","summary":"天穹領域存在一種稱為「序場」（Order Field）的異常環境。\n\n它傾向令物質、機械及神經訊號進入高度規律的狀態。\n探險者在天穹逗留得愈久，身體便愈會適應這種規律。\n當他們返回都市、失去序場支持時，人體原本複雜而不規則的生理活","body":"天穹領域存在一種稱為「序場」（Order Field）的異常環境。\n\n它傾向令物質、機械及神經訊號進入高度規律的狀態。\n探險者在天穹逗留得愈久，身體便愈會適應這種規律。\n當他們返回都市、失去序場支持時，人體原本複雜而不規則的生理活動可能失去協調。\n\n這種負荷的恐怖之處，是人類會逐步失去生命本來具有的靈活性。\n\n|級別|天穹負荷表現|\n|---|---|\n|I|耳鳴、對稱性幻視、皮膚刺痛|\n|II|肌肉短暫僵硬、語音機械化、動作重複|\n|III|神經訊號失調、感覺時間被分割、無法正常睡眠|\n|IV|身體局部硬化、關節失去靈活性、記憶以固定片段重播|\n|V|肉體出現不可逆的晶格或機械化變異|\n|VI|個體可能喪失自主行動，被序場殘留反應支配|\n\n更恐怖的是：身體依然是血肉，但每次眨眼、呼吸和心跳都開始遵守某個絕對固定的節拍。\n這個人沒有死，卻開始像一部機械。\n\n","visibility":"published","updated_at":"2026-10-24","order_index":3},{"id":"seed-5","title":"響場與深淵負荷","category":"探索指南","summary":"核心機制：響場\n\n「響場」是創世彎曲後，充斥世界內部的一種特殊物理場。\n它並不是有意識的神明力量，而更接近電磁場或重力場——有規律，可以量度，也能與物質互相作用。\n\n但響場有一個與普通自然場不同的特點：\n它能與具有特定結構的物質、","body":"### 核心機制：響場\n\n「響場」是創世彎曲後，充斥世界內部的一種特殊物理場。\n它並不是有意識的神明力量，而更接近電磁場或重力場——有規律，可以量度，也能與物質互相作用。\n\n但響場有一個與普通自然場不同的特點：\n它能與具有特定結構的物質、聲音和神經活動產生共振。\n這就是魔法能夠存在的基本原因。\n\n上城利用精密機械將響場轉化為穩定的機械功、電力與熱量。\n下城則透過咒文、符文、晶體、儀式，以及人體本身的感知能力來操縱它。\n\n兩者使用的不是兩套不同的能量。\n科技與魔法，本質上是對同一種自然現象的兩種利用方法。\n這一點可以成為整個世界科學、宗教及政治衝突的核心。\n\n深淵領域存在高濃度的「響場」（Resonance Field）。\n\n響場會與神經系統、生命組織和記憶活動互相影響。\n當探險者在深淵逗留一段時間後，身體便逐漸適應當地環境。\n\n但當他們向上返回都市，體內的共振狀態無法立即恢復，便會產生深淵負荷。\n級別\t深淵負荷表現\n\nI\t暈眩、嘔吐、耳內聽到自己的回聲\nII\t聽見不存在的聲音、觸覺與視覺混淆\nIII\t記憶斷裂、感受到其他生命的情緒\nIV\t身體局部異化、感官器官功能改變\nV\t肉體與自我認知逐漸分離，出現持續變形\nVI\t個體可能喪失原有形態，成為深淵生態的一部分","visibility":"published","updated_at":"2026-10-24","order_index":4},{"id":"seed-6","title":"聖痕派與縫禮派","category":"宗教與文化","summary":"兩派都崇拜同一道天之縫，但教義完全不同。\n\n雙派共同承認的四大信條\n1. 世界曾經破碎。 黑龍帶來的災難使人類文明幾乎滅亡。\n2. 世界曾經被接合。 天神改變世界的形態，使倖存者得以在新的環境中延續文明。\n3. 天之縫不可被遺忘。","body":"兩派都崇拜同一道天之縫，但教義完全不同。\n\n雙派共同承認的四大信條\n1. 世界曾經破碎。 黑龍帶來的災難使人類文明幾乎滅亡。\n2. 世界曾經被接合。 天神改變世界的形態，使倖存者得以在新的環境中延續文明。\n3. 天之縫不可被遺忘。 它是人類共同歷史的證明，不應由任何個人或組織獨占。\n4. 人類有延續文明的責任。 不論如何解釋神意，兩派都認為保護環淵是重要的宗教義務。\n\n上城｜聖痕派\n上城相信，人類終有一天可以透過計算與機械，重現天神的創世技術。\n\n\n標準宗教配色\n古銅、象牙白、機械灰及金色。\n\n聖物\n精密鐘錶、測量尺、天文儀及經正式祝聖的工程工具。\n\n信仰姿勢\n右手放在心口，左手向外攤開，代表以人類之心觀察世界。\n\n## 1. 核心教義：《創世可證論》\n\n聖痕派相信，天神的創世奇蹟並非無法理解的神秘行為，而是一項遠超人類現有技術的工程。\n\n祂並不是憑空讓世界變成圓柱，而是掌握了人類尚未發現的自然規律。\n既然創世工程具有規律，就必然可以透過數學、測量、實驗和技術逐漸理解。\n\n因此，聖痕派最重要的信條是：「理解世界，就是接近神明。」\n\n他們認為每一次工程突破，都是人類向天神的智慧邁進一步。\n一位改善城市供水的工程師，與一位研究天之縫的神學家，都可以被認為是在進行神聖工作。\n\n### 聖痕派的五大教條\n\n|教條|名稱|意義|\n|---|---|---|\n|第一誡|萬物可知|不應因為現象難以理解，就停止研究|\n|第二誡|量度即敬|誠實觀測自然，是對創世者的尊重|\n|第三誡|工藝即禱|能改善人類生活的創造，本身具有神聖性|\n|第四誡|證明先於宣告|不應把尚未證實的猜測宣稱為神諭|\n|第五誡|終將再現|人類應以理解創世工程為長遠目標|\n\n第五誡是聖痕派最具爭議的信條。\n部分信徒認為，人類最終應該獲得與天神相同的能力，甚至自行創造新的世界。\n但溫和派認為，理解創世規律不等於有權隨意改造世界。\n這使聖痕派內部存在重要的神學分歧。\n\n## 聖痕派的宗教職階\n\n|職位|英文|職責|\n|---|---|---|\n|首席證理官|First Verifier|教團最高神學及學術領袖|\n|大司衡|Grand Measurer|管理天之縫觀測及創世研究|\n|鐘律司祭|Clock Canon|主持祝聖、婚禮、祭典及宗教教育|\n|工藝修士|Artisan Brother/Sister|修繕宗教設施、參與公共工程|\n|見習量者|Novice Observer|研習測量、神學與工程基礎|\n\n**《第一大教堂》**\n\n大教堂位於環淵上城的鐘械區，面向天之縫。\n整座建築以大型鐘錶機構為核心，設有數十個不同大小的齒輪與擺鐘。\n中央祭壇不是神像，而是一座以金屬、光學鏡片及數學比例構成的「創世模型」。\n信徒相信，每次模型因研究而變得更準確，便象徵人類對神明的理解又前進一步。\n宗教儀式通常由鐘聲、機械管風琴和集體朗讀組成。\n\n### 聖痕派日常祈禱\n\n> 「願我的雙眼不拒絕真相。」\n> 「願我的雙手不畏懼創造。」\n> 「願一切未知終得其理。」\n> 「願世界的接縫，終能被我們理解。」\n\n\n下城｜縫禮派\n下城相信，人類不應該模仿神明，而應該學會聆聽世界接合時留下的聲音。\n\n標準宗教配色\n深紫、銀白、淡藍及灰紫色。\n\n聖物\n銀線、空白書頁、鈴鐺、編織物及記錄生命故事的卷軸。\n\n信仰姿勢\n雙手交握於胸前，然後慢慢打開，象徵接受與放下。\n\n## 核心教義：《萬響同織論》\n\n縫禮派不否認科學能夠理解世界，也不認為人類不應該發明技術。\n但他們相信，世界之所以值得存在，並不只是因為它能被理解。\n一件事物還可能承載記憶、願望、情感、關係，以及尚未實現的可能。\n因此，縫禮派將創世理解為一種「連接」的行為。\n\n天神並非單純將兩塊大陸接上，而是讓原本互不相連的事物，能夠重新互相影響。\n「聆聽世界，就是理解生命與生命之間的連繫。」\n縫禮派認為，人類最大的傲慢不是研究神明，而是認為只要能夠測量一件事物，便已經完全理解它。\n\n### 縫禮派的五大教條\n\n|教條|名稱|意義|\n|---|---|---|\n|第一誡|萬物有響|每個生命和行為都可能在世界留下痕跡|\n|第二誡|聆聽先於言語|理解他人之前，不應急於給予答案|\n|第三誡|不奪其聲|不應強迫他人接受自己的願望和想像|\n|第四誡|縫補而非取代|應尊重原有生命與記憶，而非任意抹除|\n|第五誡|留有未竟|沒有任何生命必須被一個固定結局完全定義|\n\n第五誡尤其重要。\n\n縫禮派相信，故事可以被延續，但不應被強行固定。\n\n\n\n\n## 縫禮派的宗教職階\n\n|職位|英文|職責|\n|---|---|---|\n|大聆者|High Listener|教團最高精神領袖|\n|縫世祭司|Seamweaver|主持宗教儀式及神學傳承|\n|迴響修女／修士|Echo Keeper|收集、保存及照顧生命故事|\n|導聲者|Voiceguide|負責精神輔導、喪禮及負荷患者照護|\n|見習聆者|Novice Listener|學習冥想、魔法與宗教歷史|\n\n《聖織堂》\n\n縫禮派的神職人員通常需要接受一定的心理輔導和響場安全訓練。\n因為他們會接觸大量喪親者、失蹤者家屬及受到深淵負荷影響的人。\n縫禮派最重要的宗教能力，不是戰鬥魔法，而是陪伴、傾聽、協助理解與接受失去。\n\n位於環淵下城的靈紋區。\n教堂沒有傳統意義上的大型神像。\n中央是一道由無數銀色細線編織的巨大帷幕。\n每條線都代表某個生命留下的故事。\n\n當新的孩子出生、有人結婚，或者遠征者死去，家屬都可以為其增加一條線。\n教團會定期更換與修復老化的絲線，但必須先得到捐獻者或其家屬的意願確認。\n\n這也象徵：記住某個人，並不代表要永遠把他束縛在同一個形象之中。\n\n### 縫禮派日常祈禱\n\n> 「願我聽見未被說出的聲音。」\n> 「願我理解尚未成形的願望。」\n> 「願我珍惜每一次相遇。」\n> 「願所有故事，都有選擇如何延續的自由。」\n\n","visibility":"published","updated_at":"2026-10-24","order_index":5},{"id":"sample-academy","title":"環淵中央綜合學院","category":"學院與公會","summary":"跨越機械與魔法的中環綜合學院，設有雙域探索學部、遺物收藏館及研發所。","body":"# 環淵中央綜合學院\n*Meridian Central Academy*\n\n「理解未知，想像未來，親手創造。」\n\n環淵中央綜合學院位於中環，連接交界大市與合縫廣場，是主角群求學、結識同伴及接受遠征實習的主要場所。\n\n## 八大學部\n- 機械與工程學部\n- 魔法與符文學部\n- 醫療與生命科學學部\n- 歷史與文明研究學部\n- 城市建設與公共技術學部\n- 商業與公共行政學部\n- 遺物科學與應用學部\n- 雙域探索學部\n\n## 重要設施\n中央共鳴廣場、雙域模擬訓練館、中央學術大圖書館、學生宿舍、中央遺物收藏館及中央遺物研發所。\n\n## 遠征者培訓\n學院與環淵探索協會合作，以模擬演習、監督式實習及專業考核培養登穹者與潛淵者。\n\n> 此為公開入門導覽摘要；可以在編輯器中加入已寫好的完整篇章。\n","visibility":"published","updated_at":"2026-10-24","order_index":7},{"id":"sample-association","title":"環淵探索協會","category":"學院與公會","summary":"正式遠征登記、任務委託、E 級資格與 C 級委託制度。","body":"# 環淵探索協會\n*Meridian Exploration Association · MEA*\n\n成立於 **SE 812**，負責遠征隊登記、任務媒合、測繪紀錄、救援協調和職業培訓。\n\n## 探索者職業資格\n- E-0 見習者\n- E-1 初級探索者\n- E-2 正式探索者\n- E-3 資深探索者\n- E-4 特級探索專家\n\n## 委託分類\n- C-I 市內支援級\n- C-II 常規遠征級\n- C-III 專業探索級\n- C-IV 高危遠征級\n- C-V 特別危機級\n\n> 本頁為速覽。GM 可以在編輯器中替換為完整的第十篇文章。\n","visibility":"published","updated_at":"2026-10 function card(a){return `<article class="card" style="cursor:pointer" onclick="navigate('library','${esc(a.id)}')"><div class="num">${esc(a.category)} · ARCHIVE</div><h3>${esc(a.title)}</h3><p>${esc(a.summary||"環淵中央史院公開館藏。")}</p><div class="end"><span>閱讀文獻</span><span>→</span></div></article>`}
function renderLibrary(){const aa=publicArticles().filter(a=>(filter==="全部"||filter===a.category)&&[a.title,a.summary,a.category,a.body].join(" ").toLowerCase().includes(search.toLowerCase()));const a=getArticle(selectedId);const active=a&&a.visibility==="published"?a:null;return `<div class="layout section"><div class="sectionhead"><div><div class="overline">THE COMPENDIUM</div><h2>環淵世界百科</h2><p>Player-visible knowledge · 公開世界觀資料</p></div><span class="pill">${publicArticles().length} 篇公開</span></div><div class="toolbar"><input class="field" value="${esc(search)}" oninput="search=this.value;selectedId=null;refreshLibrary()" placeholder="搜尋文章、事件與關鍵詞"><select class="select" onchange="filter=this.value;selectedId=null;refreshLibrary()">${categories().map(c=>`<option ${filter===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div id="libraryInner">${libraryInner(aa,active)}</div></div>`}
function libraryInner(aa,active){return `<div class="reader"><div class="sidebar"><div class="overline" style="margin-bottom:12px">ARCHIVE INDEX</div>${aa.map(a=>`<button class="sidecat ${active&&active.id===a.id?"active":""}" onclick="selectedId='${esc(a.id)}';refreshLibrary()">${esc(a.title)}</button>`).join("")||'<p class="subtle">沒有相關文章</p>'}</div>${active?`<article class="paper"><div class="paper-head"><div class="overline">${esc(active.category)} · PUBLIC DOCUMENT</div><h1>${esc(active.title)}</h1><p class="subtle">${esc(active.summary||"")}</p><small class="subtle">更新：${esc((active.updated_at||"").slice(0,10))}</small></div><div class="content">${md(active.body)}</div></article>`:`<div class="paper"><div class="overline">OPEN AN ARCHIVE</div><h2>選擇一篇文獻</h2><p class="subtle">在左側挑選篇章，以史院公開資料開始閱讀。</p><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${aa.slice(0,3).map(card).join("")}</div></div>`}</div>`}
function refreshLibrary(){const aa=publicArticles().filter(a=>(filter==="全部"||filter===a.category)&&[a.title,a.summary,a.category,a.body].join(" ").toLowerCase().includes(search.toLowerCase()));const a=getArticle(selectedId);el("libraryInner").innerHTML=libraryInner(aa,a&&a.visibility==="published"?a:null)}
function renderTimeline(){const ev=database.events.filter(e=>e.title.includes(search)||e.description.includes(search)||String(e.year).includes(search));return `<div class="layout section"><div class="sectionhead"><div><div class="overline">PUBLIC CHRONICLES · SE 1–1900</div><h2>環淵公開編年史</h2><p>百代的發現、建設與傳承</p></div><span class="pill">${ev.length} 件事件</span></div><div class="toolbar"><input class="field" value="${esc(search)}" oninput="search=this.value;render()" placeholder="搜尋年份、人物或事件"><button class="small-btn" onclick="search='';render()">清除</button></div><div class="timeline">${ev.sort((a,b)=>a.year-b.year).map(e=>`<div class="event"><strong>SE ${e.year}</strong><b>${esc(e.title)}</b><p>${esc(e.description)}</p></div>`).join("")||'<div class="empty">無符合紀錄。</div>'}</div></div>`}
function renderCalendar(){let c=cal,holiday=FESTIVALS[c.month+"-"+c.day],leap=c.year%4===0&&(c.year%100!==0||c.year%400===0);return `<div class="layout section"><div class="sectionhead"><div><div class="overline">THE SEAM CALENDAR</div><h2>互動縫合曆</h2><p>12環月、30日環月、6日環週與5個界外日</p></div><button class="small-btn" onclick="cal={year:1900,month:8,day:18};render()">返回 SE 1900</button></div><div class="calendarwrap"><div class="paper"><div class="toolbar"><label>縫合曆 SE <input class="input" style="width:116px" type="number" min="1" max="9999" value="${c.year}" onchange="cal.year=Math.max(1,Math.min(9999,+this.value||1900));render()"></label><label>環月 <select class="select" onchange="cal.month=+this.value;cal.day=1;render()">${MONTHS.map((a,i)=>`<option value="${i+1}" ${c.month===i+1?"selected":""}>${a[0]}</option>`).join("")}</select></label></div><div class="sectionhead"><button class="small-btn" onclick="changeMonth(-1)">‹</button><h2 style="margin:0">${MONTHS[c.month-1][0]} <small style="font:15px Georgia;color:var(--gold)">${MONTHS[c.month-1][1]}</small></h2><button class="small-btn" onclick="changeMonth(1)">›</button></div><div class="weekdays">${WEEKDAYS.map(d=>`<span>${d}</span>`).join("")}</div><div class="caldays">${Array.from({length:30},(_,i)=>{let n=i+1;return `<button class="day ${FESTIVALS[c.month+"-"+n]?"feast":""} ${c.day===n?"sel":""}" onclick="cal.day=${n};render()" title="${esc(FESTIVALS[c.month+"-"+n]||"")}">${n}</button>`}).join("")}</div></div><div class="paper"><div class="overline">SELECTED DATE</div><h2>SE ${c.year}/${String(c.month).padStart(2,'0')}/${String(c.day).padStart(2,'0')}</h2><p>${MONTHS[c.month-1][0]} · ${WEEKDAYS[(c.day-1)%6]}</p><h3 style="color:var(--gold)">${holiday||"一般鐘日"}</h3><p class="subtle">六日環週依序循環，各環月一日皆為齒日。</p><div style="border-top:1px solid var(--edge);margin:18px 0"></div><h3>界外日 · The Unbound Days</h3>${["舊土日","黑翼日","合縫日",...(leap?["靜縫日"]:[]),"無燈日","新輪夜"].map(n=>`<div class="event" style="margin-bottom:7px">${n}</div>`).join("")}<p class="subtle" style="font-size:12px">每年360個環月日，另設5個界外日。閏年加設靜縫日；界外日不屬環週。</p></div></div></div>`}
function changeMonth(d){cal.month+=d;if(cal.month>12){cal.month=1;cal.year++}if(cal.month<1){cal.month=12;cal.year=Math.max(1,cal.year-1)}cal.day=1;render()}

function renderEditor(){return `<div class="layout section"><div class="sectionhead"><div><div class="overline">RESTRICTED · ARCHIVE STUDIO</div><h2>GM 編輯工作室</h2><p>${remote?"已連接雲端；出版內容即時供玩家閱讀。":"本機示範模式：修改只儲存在這個瀏覽器，不會自動傳到玩家裝置。"}</p></div><button class="small-btn" onclick="openSettings()">⚙ 網站設定</button></div><div class="note" style="margin-bottom:18px">${remote?"正式權限由資料庫 RLS 核實。只有已列入管理員名單的帳戶可以修改文章。":"⚠ 本機模式不具真正的使用者隔離或線上同步；正式公開前請依部署指南連接 Supabase，勿將 GM 秘密用作玩家網站的公開初始資料。"}</div><div class="toolbar"><button class="small-btn ${editorTab==='articles'?'primary':''}" onclick="editorTab='articles';selectedId=null;render()">文章管理</button><button class="small-btn ${editorTab==='events'?'primary':''}" onclick="editorTab='events';selectedEvent=null;render()">年歷事件</button><button class="small-btn" onclick="exportData()">↓ 匯出 JSON</button><label class="small-btn" style="cursor:pointer">↑ 匯入 JSON <input hidden type="file" accept=".json,application/json" onchange="importData(this)"></label><button class="small-btn" onclick="exportArticleMarkdown()">↓ 當前 Markdown</button></div>${editorTab==="articles"?articleEditor():eventEditor()}</div>`}
function articleEditor(){let a=getArticle(selectedId);return `<div class="admin-grid"><aside class="paper" style="padding:16px"><button class="small-btn primary" style="width:100%;margin-bottom:12px" onclick="newArticle()">＋ 新文章</button><input class="input" id="editSearch" style="width:100%;margin-bottom:12px" placeholder="搜尋稿件..." oninput="filterEditList(this.value)"><div class="list-scroll" id="editList">${editorList()}</div></aside><div class="paper">${a?`<div class="overline">DOCUMENT EDITOR · ${esc(a.id)}</div><div class="formgrid"><label class="label">標題<input class="input" id="a-title" value="${esc(a.title)}" oninput="dirty=true"></label><label class="label">分類<select class="select" id="a-category" onchange="dirty=true">${categories().filter(c=>c!=="全部").map(c=>`<option ${a.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label><label class="label">發布狀態<select class="select" id="a-visibility" onchange="dirty=true"><option value="draft" ${a.visibility==="draft"?"selected":""}>草稿 · 只有 GM 可見</option><option value="published" ${a.visibility==="published"?"selected":""}>公開 · 玩家可見</option></select></label><label class="label">顯示順序<input id="a-order" class="input" type="number" value="${Number(a.order_index)||0}" oninput="dirty=true"></label></div><label class="label">摘要<textarea class="textarea" style="min-height:80px" id="a-summary" oninput="dirty=true">${esc(a.summary||"")}</textarea></label><label class="label">內文 · Markdown <textarea class="textarea" id="a-body" oninput="dirty=true;livePreview()">${esc(a.body)}</textarea></label><div class="edit-actions"><button class="small-btn primary" onclick="saveArticle()">儲存文章</button><button class="small-btn" onclick="livePreview()">更新預覽</button><button class="small-btn danger" onclick="deleteArticle()">刪除文章</button></div><div class="overline">LIVE PREVIEW</div><div id="editorPreview" class="content preview">${md(a.body)}</div>`:`<div class="empty">選取文章進行編輯，或新增一篇。<p>支援 # 標題、**粗體**、表格、引用及 Markdown 清單。</p></div>`}</div></div>`}
function editorList(q=""){return database.articles.filter(a=>a.title.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.order_index||0)-(b.order_index||0)).map(a=>`<button class="edit-item ${a.id===selectedId?"active":""}" onclick="if(dirty&&!confirm('捨棄未儲存修改？'))return;dirty=false;selectedId='${esc(a.id)}';render()">${esc(a.title)}<small>${esc(a.category)} · ${a.visibility==="published"?"● 公開":"○ 草稿"}</small></button>`).join("")}
function filterEditList(q){el("editList").innerHTML=editorList(q)}
function livePreview(){el("editorPreview").innerHTML=md(el("a-body").value)}
function newArticle(){if(dirty&&!confirm("捨棄未儲存的修改？"))return;let id="article-"+Date.now();database.articles.unshift({id,title:"未命名文章",category:"世界觀",summary:"",body:"# 新文章\n\n在此開始撰寫。",visibility:"draft",updated_at:new Date().toISOString(),order_index:database.articles.length+1});persist();selectedId=id;dirty=false;render();toast("已建立草稿。請儲存文章。")}
async function saveArticle(){let a=getArticle(selectedId);if(!a)return;let next={...a,title:el("a-title").value.trim(),category:el("a-category").value,summary:el("a-summary").value,body:el("a-body").value,visibility:el("a-visibility").value,order_index:+el("a-order").value||0,updated_at:new Date().toISOString()};if(!next.title)return toast("請輸入文章標題");if(remote){try{const {error}=await client.from("articles").upsert(next);if(error)throw error;Object.assign(a,next)}catch(e){return toast("儲存失敗："+e.message)}}else Object.assign(a,next);persist();dirty=false;render();toast("文章已儲存。"+(next.visibility==="published"?"玩家可閱讀。":"仍為 GM 草稿。"))}
async function deleteArticle(){if(!selectedId||!confirm("確定永久刪除此文章？"))return;try{if(remote){let {error}=await client.from("articles").delete().eq("id",selectedId);if(error)throw error}database.articles=database.articles.filter(a=>a.id!==selectedId);persist();selectedId=null;dirty=false;render();toast("文章已刪除")}catch(e){toast(e.message)}}
function eventEditor(){return `<div class="admin-grid"><div class="paper" style="padding:16px"><button class="small-btn primary" style="width:100%" onclick="newEvent()">＋ 新增事件</button><div class="list-scroll" style="margin-top:12px">${database.events.slice().sort((a,b)=>b.year-a.year).map(e=>`<button class="edit-item" onclick="selectedEvent=${e.id?JSON.stringify(e.id):JSON.stringify(e.year+'_'+e.title)};render()">SE ${e.year} · ${esc(e.title)}</button>`).join("")}</div></div><div class="paper">${selectedEvent?(()=>{let e=findEvent();return e?`<div class="overline">CHRONICLE EDITOR</div><label class="label">年份 SE<input class="input" type="number" min="1" id="e-year" value="${e.year}"></label><label class="label">事件標題<input class="input" id="e-title" value="${esc(e.title)}"></label><label class="label">公開描述<textarea class="textarea" id="e-desc" style="min-height:140px">${esc(e.description)}</textarea></label><div class="edit-actions"><button class="small-btn primary" onclick="saveEvent()">儲存事件</button><button class="small-btn danger" onclick="deleteEvent()">刪除事件</button></div>`:"無效事件"})():"<div class='empty'>選擇一件事件，或新增公開編年紀錄。</div>"}</div></div>`}
function eventKey(e){return e.id||e.year+"_"+e.title}
function findEvent(){return database.events.find(e=>eventKey(e)===selectedEvent)}
function newEvent(){let e={id:"event-"+Date.now(),year:1900,title:"新事件",description:""};database.events.push(e);selectedEvent=e.id;persist();render()}
async function saveEvent(){let e=findEvent();if(!e)return;let next={...e,year:Math.max(1,+el("e-year").value),title:el("e-title").value.trim(),description:el("e-desc").value};try{if(remote){let {error}=await client.from("chronicle_events").upsert({id:typeof e.id==="string"&&e.id.startsWith("event-")?undefined:e.id,year:next.year,title:next.title,description:next.description});if(error)throw error;await reloadRemote()}else Object.assign(e,next);persist();selectedEvent=null;render();toast("年歷事件已儲存")}catch(err){toast("儲存失敗："+err.message)}}
async function deleteEvent(){let e=findEvent();if(!e||!confirm("刪除這件公開事件？"))return;try{if(remote){let {error}=await client.from("chronicle_events").delete().eq("id",e.id);if(error)throw error}database.events=database.events.filter(x=>x!==e);persist();selectedEvent=null;render()}catch(err){toast(err.message)}}
function exportData(){let blob=new Blob([JSON.stringify(database,null,2)],{type:"application/json"});download(blob,"meridian-archive-backup.json")}
function exportArticleMarkdown(){let a=getArticle(selectedId);if(!a)return toast("請先選擇文章");download(new Blob([a.body],{type:"text/markdown"}),a.title.replace(/[\\/:*?"<>|]/g,"_")+".md")}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(input){let f=input.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.articles)||!Array.isArray(d.events))throw Error("必須包含 articles 與 events");if(!confirm(`匯入 ${d.articles.length} 篇文章及 ${d.events.length} 件事件？將取代目前資料。`))return;if(remote)throw Error("雲端模式請逐篇匯入，避免覆寫其他管理員的工作。");database=d;persist();selectedId=null;render();toast("資料已匯入")}catch(e){toast("匯入失敗："+e.message)}}
function openLogin(){el("modalroot").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="overline">RESTRICTED ACCESS</div><h2>GM 登入</h2><p class="subtle">${remote?"以 Supabase 電郵帳戶登入。資料庫會驗證管理員身分。":"本機示範可直接進入編輯器；這不是安全的身份驗證。"}</p>${remote?`<div class="stack"><input id="loginEmail" class="input" placeholder="管理員 Email" type="email"><input id="loginPass" class="input" placeholder="密碼" type="password"><button class="small-btn primary" onclick="loginRemote()">登入</button></div>`:`<button class="small-btn primary" onclick="admin=true;closeModal();navigate('editor')">進入本機示範編輯器</button>`}<button class="small-btn" onclick="openSettings()">設定雲端同步</button><button class="small-btn" onclick="closeModal()">取消</button></div></div>`}
function closeModal(){el("modalroot").innerHTML=""}
async function logout(){if(remote&&client)await client.auth.signOut();admin=false;authUser=null;route="home";render();toast("已登出")}
async function loginRemote(){const email=el("loginEmail").value, password=el("loginPass").value;let {data,error}=await client.auth.signInWithPassword({email,password});if(error)return toast(error.message);authUser=data.user;await verifyAdmin();if(!admin)return toast("帳戶沒有 GM 權限，無法編輯。");closeModal();navigate("editor")}
async function verifyAdmin(){admin=false;if(!client)return;let {data:{user}}=await client.auth.getUser();authUser=user;if(!user)return;let {data,error}=await client.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();admin=!error&&!!data}
function openSettings(){el("modalroot").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="overline">DEPLOYMENT CONFIGURATION</div><h2>雲端與權限設定</h2><p class="subtle">輸入 Supabase 專案網址與 <b>anon/publishable key</b>。不可填入 service_role / secret key。</p><div class="stack"><label class="label">Supabase URL<input class="input" id="cfgUrl" value="${esc(config.url||"")}" placeholder="https://xxxx.supabase.co"></label><label class="label">Publishable / anon key<input class="input" id="cfgKey" value="${esc(config.key||"")}" placeholder="sb_publishable_..."></label><button class="small-btn primary" onclick="saveSettings()">儲存並連接</button><button class="small-btn" onclick="disconnect()">切回本機示範</button><button class="small-btn" onclick="closeModal()">關閉</button></div><p class="subtle" style="font-size:12px">正式公開玩家網址時，請把專案網址與 publishable key 寫進 config.js，讓所有瀏覽器共用相同資料庫；後台權限由 SQL RLS 控制。</p></div></div>`}
function saveSettings(){let url=el("cfgUrl").value.trim(),key=el("cfgKey").value.trim();if(!url.startsWith("https://")||!key)return toast("請填入有效 URL 和公開金鑰");localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));location.reload()}
function disconnect(){localStorage.removeItem(CONFIG_KEY);location.reload()}
let config={};try{config=JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}")}catch(e){}
if(window.MERIDIAN_CONFIG?.url&&window.MERIDIAN_CONFIG?.key)config=window.MERIDIAN_CONFIG;
async function reloadRemote(){if(!client)return;let [{data:a,error:e1},{data:ev,error:e2}]=await Promise.all([client.from("articles").select("*").order("order_index"),client.from("chronicle_events").select("*").order("year")]);if(e1||e2)throw e1||e2;database={articles:a||[],events:ev||[]}}
async function init(){if(config.url&&config.key){if(!window.supabase)return toast("無法載入 Supabase JS。請確認網路連線。");try{client=window.supabase.createClient(config.url,config.key);remote=true;await verifyAdmin();await reloadRemote();client.auth.onAuthStateChange(async()=>{await verifyAdmin();await reloadRemote();render()})}catch(e){remote=false;client=null;toast("雲端連線失敗："+e.message)}}render()}
init();
</script>
</body></html>
